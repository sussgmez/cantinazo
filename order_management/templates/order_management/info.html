{% extends "core/base.html" %}
{% block content %}
  <nav class="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-50 mb-8 font-sans">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16 items-center">
        <div class="shrink-0 flex items-center gap-2">
          <svg class="w-8 h-8 text-amber-500"
               fill="none"
               stroke="currentColor"
               viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14v6" />
          </svg>
          <span class="font-bold text-xl text-slate-800 tracking-tight">Promo<span class="text-amber-500">Mapis</span></span>
        </div>
        <div class="flex items-center space-x-1 sm:space-x-2">
          <a href="{% url 'info' %}"
             class="px-3 py-2 rounded-md text-sm font-semibold text-amber-700 bg-amber-50 transition-colors">
            Resumen
          </a>
          <a href="{% url 'staff' %}"
             class="px-3 py-2 rounded-md text-sm font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-50 transition-colors">
            Eventos
          </a>
          <div class="hidden sm:block w-px h-6 bg-slate-200 mx-2"></div>
          <form action="{% url 'logout' %}" method="post" class="inline m-0 p-0">
            {% csrf_token %}
            <button type="submit"
                    class="flex items-center gap-1 px-3 py-2 rounded-md text-sm font-medium text-rose-600 hover:text-rose-700 hover:bg-rose-50 transition-colors">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
              </svg>
              <span class="hidden sm:inline">Salir</span>
            </button>
          </form>
        </div>
      </div>
    </div>
  </nav>
  <div class="w-full max-w-6xl mx-auto space-y-8 p-2 font-sans">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col">
        <div class="bg-slate-50 px-6 py-4 border-b border-slate-100 flex justify-between items-center">
          <h3 class="font-bold text-slate-700 flex items-center gap-2">
            <svg class="w-5 h-5 text-emerald-500"
                 fill="none"
                 stroke="currentColor"
                 viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            Fondo Recaudado
          </h3>
          <div id="total-income"></div>
        </div>
        {% if user.is_superuser %}
          <div class="p-6 bg-white">
            <form class="flex gap-2 items-end"
                  hx-post="{% url "movement-create" %}"
                  hx-swap="none"
                  hx-on::after-request="this.reset()">
              {% csrf_token %}
              <input type="hidden" name="category" value="income">
              <div class="grow">
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Descripción</label>
                <input type="text"
                       placeholder="Ej. Cantinazo"
                       class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none"
                       name="description"
                       required>
              </div>
              <div class="w-24">
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Monto</label>
                <input type="number"
                       placeholder="$"
                       class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none"
                       name="amount"
                       required>
              </div>
              <button class="bg-emerald-600 hover:bg-emerald-700 text-white p-2 rounded-lg transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                </svg>
              </button>
            </form>
          </div>
        {% endif %}
        <div class="border-t border-slate-100 bg-slate-50 grow">
          <div class="px-6 py-2 bg-slate-100 border-b border-slate-200 text-xs font-bold text-slate-500 uppercase tracking-wider">
            Ingresos
          </div>
          <ul class="divide-y divide-slate-200 max-h-48 overflow-y-auto"
              hx-get="{% url "movement-list" %}?category=income"
              hx-trigger="load, movement-created from:body, movement-deleted from:body">
          </ul>
        </div>
      </div>
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col">
        <div class="bg-slate-50 px-6 py-4 border-b border-slate-100 flex justify-between items-center">
          <h3 class="font-bold text-slate-700 flex items-center gap-2">
            <svg class="w-5 h-5 text-rose-500"
                 fill="none"
                 stroke="currentColor"
                 viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 17h8m0 0V9m0 8l-8-8-4 4-6-6" />
            </svg>
            Gastos del Evento
          </h3>
          <div id="total-spent"></div>
        </div>
        {% if user.is_superuser %}
          <div class="p-6 bg-white">
            <form class="flex gap-2 items-end"
                  hx-post="{% url "movement-create" %}"
                  hx-swap="none"
                  hx-on::after-request="this.reset()">
              {% csrf_token %}
              <input type="hidden" name="category" value="spent">
              <div class="grow">
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Descripción</label>
                <input type="text"
                       placeholder="Ej. Transporte"
                       class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-rose-500 outline-none"
                       name="description"
                       required>
              </div>
              <div class="w-24">
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Monto</label>
                <input type="number"
                       placeholder="$"
                       class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-rose-500 outline-none"
                       name="amount"
                       required>
              </div>
              <button class="bg-rose-600 hover:bg-rose-700 text-white p-2 rounded-lg transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                </svg>
              </button>
            </form>
          </div>
        {% endif %}
        <div class="border-t border-slate-100 bg-slate-50 grow">
          <div class="px-6 py-2 bg-slate-100 border-b border-slate-200 text-xs font-bold text-slate-500 uppercase tracking-wider">
            Historial de salidas
          </div>
          <ul class="divide-y divide-slate-200 max-h-48 overflow-y-auto">
            <ul class="divide-y divide-slate-200 max-h-48 overflow-y-auto"
                hx-get="{% url "movement-list" %}?category=spent"
                hx-trigger="load, movement-created from:body, movement-deleted from:body">
            </ul>
          </ul>
        </div>
      </div>
    </div>
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 relative overflow-hidden font-sans"
         hx-get="{% url "progress-bar" %}"
         hx-trigger="load, movement-created from:body, movement-deleted from:body"></div>
  </div>
{% endblock content %}
