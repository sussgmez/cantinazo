<div class="flex flex-col md:flex-row justify-between items-end mb-6 gap-4">
    <div>
        <h4 class="text-slate-500 font-bold uppercase tracking-wider text-xs mb-1">Meta: Acto de Grado</h4>
        <div class="flex items-baseline gap-2">
            <span class="text-4xl font-extrabold text-slate-800">${{ total|floatformat:2 }}</span>
            <span class="text-sm text-slate-400 font-medium">recaudados</span>
        </div>
    </div>
    <div class="text-right">
        <p class="text-sm font-semibold text-slate-600">Objetivo: ${{ goal|floatformat:2 }}</p>
        <p class="text-xs text-amber-600 font-medium mt-1">Faltan: ${{ remaining|floatformat:2 }}</p>
    </div>
</div>
<div class="mb-8">
    <div class="flex justify-between text-xs font-semibold text-slate-400 mb-2">
        <span>Progreso</span>
        <span>{{ progress|floatformat:1 }}%</span>
    </div>
    <div class="w-full bg-slate-100 rounded-full h-4 overflow-hidden shadow-inner">
        <div class="bg-linear-to-r from-amber-400 to-orange-500 h-4 rounded-full transition-all duration-1000 ease-out shadow-sm"
             style="width: {{ progress|floatformat:'.2' }}%"></div>
    </div>
</div>
<div class="grid grid-cols-2 gap-4 border-t border-slate-100 pt-6">
    <div class="flex flex-col">
        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Total Ingresos</span>
        
        <div class="flex items-center gap-2 text-emerald-600">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 11l5-5m0 0l5 5m-5-5v12" />
            </svg>
            <span class="text-xl font-bold">+${{ total_incomes|floatformat:2 }}</span>
        </div>
    </div>
    <div class="flex flex-col border-l border-slate-100 pl-4">
        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Total Gastos</span>
        <div class="flex items-center gap-2 text-rose-500">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 13l-5 5m0 0l-5-5m5 5V6" />
            </svg>
            <span class="text-xl font-bold">-${{ total_spents|floatformat:2 }}</span>
        </div>
    </div>
</div>
