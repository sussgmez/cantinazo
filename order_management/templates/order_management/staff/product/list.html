<table class="w-full text-sm text-left whitespace-nowrap font-sans">
  <thead class="sticky top-0 bg-white z-10 shadow-[0_1px_0_rgba(226,232,240,1)]">
    <tr>
      <th class="py-2.5 px-3 font-semibold text-slate-500 uppercase tracking-wider text-[11px] border-b border-slate-100">
        Producto
      </th>
      <th class="py-2.5 px-3 font-semibold text-slate-500 uppercase tracking-wider text-[11px] text-center border-b border-slate-100">
        Precio
      </th>
      <th class="py-2.5 px-3 font-semibold text-slate-500 uppercase tracking-wider text-[11px] text-center border-b border-slate-100">
        Disponible
      </th>
      <th class="py-2.5 px-3 font-semibold text-slate-500 uppercase tracking-wider text-[11px] text-center border-b border-slate-100 hidden sm:table-cell">
        Vendidos
      </th>
      <th class="py-2.5 px-3 border-b border-slate-100 w-16"></th>
    </tr>
  </thead>
  <tbody class="divide-y divide-slate-100/60">
    {% for product in product_list %}
      <tr class="hover:bg-slate-50/50 transition-colors group">
        <td class="py-2 px-3 text-slate-800 font-medium text-xs sm:text-sm truncate max-w-[120px]">{{ product.name }}</td>
        <td class="py-2 px-3 text-slate-600 font-mono text-center text-xs">${{ product.price|floatformat:2 }}</td>
        <td class="py-2 px-3 text-center">
          <span class="inline-flex items-center justify-center min-w-[28px] h-5 px-1.5 rounded-full text-[11px] font-bold bg-slate-100 text-slate-700 border border-slate-200">
            {{ product.stock }}
          </span>
        </td>
        <td class="py-2 px-3 text-center text-slate-500 font-medium text-xs hidden sm:table-cell">{{ product.sold }}</td>
        <td class="py-2 px-3 flex justify-end gap-1.5">
          <button hx-get="{% url 'staff-product-update' product.pk %}"
                  hx-target="#product-update"
                  onclick="$('#product-update').show()"
                  title="Editar producto"
                  class="flex items-center justify-center w-6 h-6 sm:w-auto sm:h-auto sm:px-2 sm:py-1 rounded bg-emerald-50 hover:bg-emerald-100 text-emerald-700 transition-colors border border-transparent hover:border-emerald-200">
            <svg class="w-3.5 h-3.5"
                 fill="none"
                 stroke="currentColor"
                 viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
            </svg>
            <span class="hidden lg:inline ml-1 text-[10px] font-bold uppercase tracking-wide">Editar</span>
          </button>
          <button hx-get="{% url 'staff-product-hide' product.pk %}"
                  hx-target="#product-delete"
                  onclick="$('#product-delete').show()"
                  title="Eliminar producto"
                  class="flex items-center justify-center w-6 h-6 sm:w-auto sm:h-auto sm:px-2 sm:py-1 rounded bg-rose-50 hover:bg-rose-100 text-rose-700 transition-colors border border-transparent hover:border-rose-200">
            <svg class="w-3.5 h-3.5"
                 fill="none"
                 stroke="currentColor"
                 viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
            <span class="hidden lg:inline ml-1 text-[10px] font-bold uppercase tracking-wide">Borrar</span>
          </button>
        </td>
      </tr>
    {% endfor %}
  </tbody>
</table>
