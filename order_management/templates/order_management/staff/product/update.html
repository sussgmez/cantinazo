<div class="bg-white rounded-xl w-full max-w-md p-6 shadow-2xl border border-slate-200 transform transition-all font-sans"
     onclick="event.stopPropagation()">
  <form hx-post="{% url 'staff-product-update' product.pk %}"
        onsubmit="$('#product-update').hide();">
    {% csrf_token %}
    <div class="flex justify-between items-center mb-6">
      <h3 class="text-xl font-bold text-slate-800">Editar producto</h3>
      <button type="button"
              class="p-1.5 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-slate-200"
              onclick="$('#product-update').hide()"
              title="Cerrar">
        <svg class="w-6 h-6"
             fill="none"
             stroke="currentColor"
             viewBox="0 0 24 24"
             xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>
    <div class="space-y-4 mb-6">
      <div>
        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5 ml-1"
               for="id_name">Producto</label>
        <input class="w-full bg-slate-50 border border-slate-200 text-slate-800 text-sm rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-all placeholder:text-slate-400"
               type="text"
               placeholder="Nombre del producto"
               name="name"
               value="{{ product.name }}"
               maxlength="100"
               required=""
               id="id_name" />
      </div>
      <div class="flex gap-4 w-full">
        <div class="flex-1">
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5 ml-1"
                 for="id_price">Precio ($)</label>
          <input class="w-full bg-slate-50 border border-slate-200 text-slate-800 text-sm rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-all placeholder:text-slate-400"
                 type="number"
                 placeholder="0.00"
                 name="price"
                 value="{{ product.price|floatformat:'.2' }}"
                 step="0.1"
                 required=""
                 id="id_price" />
        </div>
        <div class="flex-1">
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5 ml-1"
                 for="id_stock">Disponible</label>
          <input class="w-full bg-slate-50 border border-slate-200 text-slate-800 text-sm rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-all placeholder:text-slate-400"
                 type="number"
                 placeholder="0"
                 name="stock"
                 value="{{ product.stock }}"
                 required=""
                 id="id_stock" />
        </div>
      </div>
    </div>
    <div class="flex gap-3 justify-end pt-2 border-t border-slate-100">
      <button type="button"
              onclick="$('#product-update').hide();"
              class="px-4 py-2 text-sm font-semibold rounded-lg bg-white border border-slate-300 text-slate-700 hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-200 transition-colors">
        Cancelar
      </button>
      <button type="submit"
              class="px-5 py-2 text-sm font-semibold rounded-lg bg-emerald-600 border border-transparent text-white hover:bg-emerald-700 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-1 transition-colors shadow-sm">
        Guardar cambios
      </button>
    </div>
  </form>
</div>
