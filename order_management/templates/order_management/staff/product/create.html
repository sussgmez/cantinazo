<form hx-post="{% url 'staff-product-create' %}"
      hx-on::after-request="if(event.detail.successful) this.reset()"
      class="flex flex-col gap-3">
  {% csrf_token %}
  <input type="hidden" name="event" value="{{ event }}" />
  <div class="flex gap-3">
    <div class="flex-2">
      <input class="w-full bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent transition-all placeholder:text-slate-400"
             type="text"
             name="name"
             placeholder="Producto"
             required />
    </div>
    <div class="flex-1">
      <input class="w-full bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent transition-all placeholder:text-slate-400"
             type="number"
             name="stock"
             placeholder="Cantidad"
             required />
    </div>
    <div class="flex-1">
      <input class="w-full bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent transition-all placeholder:text-slate-400"
             type="number"
             name="price"
             placeholder="Precio"
             step="0.01"
             required />
    </div>
  </div>
  <div class="flex justify-end">
    <button type="submit"
            class="bg-sky-700 hover:bg-sky-800 text-white text-sm font-semibold py-2.5 px-5 rounded-lg transition-colors shadow-sm cursor-pointer whitespace-nowrap">
      Añadir producto +
    </button>
  </div>
</form>
