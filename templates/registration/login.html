{% extends "core/base.html" %}
{% load static %}
{% block content %}
    <div class="bg-slate-50 min-h-screen flex flex-col items-center justify-center p-4 font-sans">
        <div class="bg-white w-full max-w-md rounded-2xl shadow-xl border border-slate-100 p-8 sm:p-10 transform transition-all">
            <div class="flex flex-col items-center text-center mb-8">
                <div class="w-16 h-16 bg-sky-50 text-sky-600 rounded-full flex items-center justify-center mb-4 border border-sky-100 shadow-inner">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14v6" />
                    </svg>
                </div>
                <h1 class="font-extrabold text-2xl text-slate-800 tracking-tight">Promo Mapis</h1>
                <p class="text-sm text-slate-500 mt-2">Ingresar al sistema</p>
            </div>
            <form method="post" class="space-y-5">
                {% csrf_token %}
                {% if form.errors %}
                    <div class="bg-rose-50 border border-rose-200 text-rose-700 px-4 py-3 rounded-lg text-sm flex items-start gap-3 animate-pulse">
                        <svg class="w-5 h-5 shrink-0 mt-0.5"
                             fill="none"
                             stroke="currentColor"
                             viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        <p class="font-medium">Nombre de usuario o contraseña incorrectos.</p>
                    </div>
                {% endif %}
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5 ml-1">Usuario</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="w-5 h-5 text-slate-400"
                                 fill="none"
                                 stroke="currentColor"
                                 viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                            </svg>
                        </div>
                        <input class="w-full bg-slate-50 border border-slate-200 text-slate-800 text-sm rounded-lg pl-10 pr-4 py-3 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent transition-all placeholder:text-slate-400"
                               type="text"
                               name="username"
                               placeholder="Ej. jperez"
                               required />
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5 ml-1">Contraseña</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="w-5 h-5 text-slate-400"
                                 fill="none"
                                 stroke="currentColor"
                                 viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                            </svg>
                        </div>
                        <input class="w-full bg-slate-50 border border-slate-200 text-slate-800 text-sm rounded-lg pl-10 pr-4 py-3 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent transition-all placeholder:text-slate-400"
                               type="password"
                               name="password"
                               placeholder="••••••••"
                               required />
                    </div>
                </div>
                <div class="pt-2">
                    <button type="submit"
                            class="w-full bg-sky-700 hover:bg-sky-800 text-white font-semibold py-3 px-4 rounded-lg transition-all duration-200 shadow-sm flex items-center justify-center gap-2 group">
                        Ingresar al portal
                        <svg class="w-4 h-4 transform group-hover:translate-x-1 transition-transform"
                             fill="none"
                             stroke="currentColor"
                             viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                        </svg>
                    </button>
                </div>
            </form>
        </div>
        <p class="mt-8 text-xs text-slate-400 font-medium tracking-wide">&copy; {% now "Y" %} Promo Mapis</p>
    </div>
{% endblock %}
